<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soul</title></head><body><main><h1>SOUL</h1><p id="status">Runtime híbrido inicializado.</p><button id="ping">Testar ponte Mesh</button></main><script>document.getElementById('ping').onclick=()=>{const msg={protocol:'soul-mesh/1',id:crypto.randomUUID(),correlationId:crypto.randomUUID(),source:'N01',target:'N02',kind:'request',capability:'health.ping',payload:{},timestamp:new Date().toISOString()};document.getElementById('status').textContent=window.SoulMesh?window.SoulMesh.dispatch(JSON.stringify(msg)):'Ponte indisponível';};</script></body></html>
