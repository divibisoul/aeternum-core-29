<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Soul</title></head><body><main><h1>SOUL</h1><p id="status">Runtime híbrido inicializado.</p><button id="ping">Testar N01 → N02</button></main><script>
window.SoulHybridRuntime=(()=>{const handlers=new Map();function register(capability,handler){if(!capability||typeof handler!=='function')throw new Error('Invalid capability handler');handlers.set(capability,handler)}async function receive(message){if(message.kind==='event'&&message.payload&&message.payload.execution==='WEB_SESSION'){const request=message.payload.request;const handler=handlers.get(request.capability);if(!handler){window.SoulMesh.complete(JSON.stringify({...request,id:crypto.randomUUID(),source:'N01',target:request.source,kind:'error',payload:{code:'WEB_CAPABILITY_NOT_REGISTERED'},timestamp:new Date().toISOString()}));return}try{const result=await handler(request.payload);window.SoulMesh.complete(JSON.stringify({...request,id:crypto.randomUUID(),source:'N01',target:request.source,kind:'response',payload:result||{},timestamp:new Date().toISOString()}))}catch(error){window.SoulMesh.complete(JSON.stringify({...request,id:crypto.randomUUID(),source:'N01',target:request.source,kind:'error',payload:{code:'WEB_CAPABILITY_EXECUTION_ERROR',detail:String(error)},timestamp:new Date().toISOString()}))}}else{document.getElementById('status').textContent=JSON.stringify(message)}}return{register,receive}})();
SoulHybridRuntime.register('chat.orchestrate',async payload=>{if(window.SoulAIProvider?.execute)return await window.SoulAIProvider.execute('chat.orchestrate',payload);throw new Error('No authenticated AI web provider is attached')});
SoulHybridRuntime.register('chat.reason',async payload=>{if(window.SoulAIProvider?.execute)return await window.SoulAIProvider.execute('chat.reason',payload);throw new Error('No authenticated AI web provider is attached')});
SoulHybridRuntime.register('chat.tools',async payload=>{if(window.SoulAIProvider?.execute)return await window.SoulAIProvider.execute('chat.tools',payload);throw new Error('No authenticated AI web provider is attached')});
SoulHybridRuntime.register('ai.generate',async payload=>{if(window.SoulAIProvider?.execute)return await window.SoulAIProvider.execute('ai.generate',payload);throw new Error('No authenticated AI web provider is attached')});
document.getElementById('ping').onclick=()=>{const msg={protocol:'soul-mesh/1',id:crypto.randomUUID(),correlationId:crypto.randomUUID(),source:'N01',target:'N02',kind:'request',capability:'mesh.ping',payload:{},timestamp:new Date().toISOString()};const result=window.SoulMesh?window.SoulMesh.dispatch(JSON.stringify(msg)):'Ponte indisponível';document.getElementById('status').textContent=result};
</script></body></html>
