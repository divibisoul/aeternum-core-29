name: SOUL Fusion Minimal E2E local CPU v0.2.0
on:
  push:
    branches: ["fusion/phase-zero-canon-20261019"]
    paths:
      - "scripts/soul-mesh-server-entry.mjs"
      - "scripts/soul-fusion-e2e-minimal.mjs"
      - "scripts/soul-fusion-synergy.mjs"
      - "integrations/langgraph-runtime/**"
      - "integrations/transformers-cpu/**"
      - ".github/workflows/soul-fusion-e2e-minimal.yml"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/soul-n01-validation.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  real-local-e2e-and-synergy:
    name: "Group F CPU inference + Group A N01 -> N07 -> LangGraph -> local model + 10x10 latency"
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LANGGRAPH_UPSTREAM_SHA: "1400d25b7b88cfa055c55b8a82bd95b7c25caef1"
      TRANSFORMERS_SHA: "6f2e80bdad560947903bb4bde8043ae95387069a"
      PYTORCH_SOURCE_SHA: "a84b7baa33f893ab92176c08a85b14455e60b2fc"
      SOUL_LOCAL_MODEL_ID: "distilbert/distilbert-base-uncased-finetuned-sst-2-english"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install N01 dependencies
        run: bun install --no-save
      - name: Configure ephemeral local-only service credentials
        shell: bash
        run: |
          set -euo pipefail
          SOUL_MESH_SECRET="$(openssl rand -hex 32)"
          SOUL_FUSION_EXECUTION_TOKEN="$(openssl rand -hex 32)"
          SOUL_FUSION_MODEL_TOKEN="$(openssl rand -hex 32)"
          {
            echo "SOUL_MESH_SECRET=$SOUL_MESH_SECRET"
            echo "SOUL_FUSION_EXECUTION_TOKEN=$SOUL_FUSION_EXECUTION_TOKEN"
            echo "SOUL_FUSION_MODEL_TOKEN=$SOUL_FUSION_MODEL_TOKEN"
            echo "SOUL_MESH_N07_URL=http://127.0.0.1:18090"
            echo "SOUL_FUSION_MODEL_URL=http://127.0.0.1:18070"
            echo "SOUL_FUSION_MODEL_PROVIDER=local-transformers-pytorch"
            echo "SOUL_FUSION_LOCAL_MODEL_URL=http://127.0.0.1:18071"
            echo "SOUL_FUSION_N01_URL=http://127.0.0.1:18080"
            echo "SOUL_MESH_N01_PORT=18080"
            echo "SOUL_MESH_N01_HOST=127.0.0.1"
            echo "N07_HTTP_ADDR=127.0.0.1:18090"
            echo "SOUL_LOCAL_MODEL_PORT=18071"
            echo "SOUL_LOCAL_MODEL_HOST=0.0.0.0"
          } >> "$GITHUB_ENV"
      - name: Create ephemeral Docker network and model cache
        run: |
          set -euo pipefail
          docker network create soul-fusion-e2e
          docker volume create soul-local-model-cache
          docker volume create soul-local-generation-cache
          docker volume create soul-langgraph-checkpoint-cache
      - name: Build isolated Transformers + PyTorch CPU image
        run: |
          set -euo pipefail
          docker build --pull --build-arg TRANSFORMERS_SHA="$TRANSFORMERS_SHA" --build-arg PYTORCH_SHA="$PYTORCH_SOURCE_SHA" \
            -t soul-transformers-pytorch-cpu:ci integrations/transformers-cpu
      - name: Group F — execute one real CPU inference, record model SHA and latency
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network soul-fusion-e2e --cpus=2 --memory=8g --mount source=soul-local-model-cache,target=/root/.cache/huggingface \
            -e SOUL_LOCAL_MODEL_ID="$SOUL_LOCAL_MODEL_ID" -e SOUL_FUSION_MODEL_TOKEN="$SOUL_FUSION_MODEL_TOKEN" \
            -e TRANSFORMERS_SOURCE_SHA="$TRANSFORMERS_SHA" -e PYTORCH_SOURCE_SHA="$PYTORCH_SOURCE_SHA" \
            --entrypoint python soul-transformers-pytorch-cpu:ci /app/infer.py --self-test | tee "$RUNNER_TEMP/group-f-self-test.log"
          MODEL_SHA="$(python3 - "$RUNNER_TEMP/group-f-self-test.log" <<'PY'
          import json,sys
          for line in reversed(open(sys.argv[1],encoding="utf-8").read().splitlines()):
              try: item=json.loads(line)
              except Exception: continue
              if item.get("event")=="group_f.cpu_inference.self_test": print(item["model_sha"]); raise SystemExit(0)
          raise SystemExit("GROUP_F_MODEL_SHA_NOT_RECORDED")
          PY
          )"
          [[ "$MODEL_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "SOUL_LOCAL_MODEL_SHA=$MODEL_SHA" >> "$GITHUB_ENV"
      - name: Group F — PyTorch torch.compile CPU smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network soul-fusion-e2e --cpus=2 --memory=8g --mount source=soul-local-model-cache,target=/root/.cache/huggingface \
            -e SOUL_LOCAL_MODEL_ID="$SOUL_LOCAL_MODEL_ID" -e SOUL_LOCAL_MODEL_SHA="$SOUL_LOCAL_MODEL_SHA" \
            -e TRANSFORMERS_SOURCE_SHA="$TRANSFORMERS_SHA" -e PYTORCH_SOURCE_SHA="$PYTORCH_SOURCE_SHA" \
            --entrypoint python soul-transformers-pytorch-cpu:ci /app/infer.py --compile-smoke | tee "$RUNNER_TEMP/group-f-torch-compile.log"
          grep -q '"status": "PASS"' "$RUNNER_TEMP/group-f-torch-compile.log"
      - name: Start local CPU inference service
        run: |
          set -euo pipefail
          docker run --detach --name soul-local-model --network soul-fusion-e2e --publish 127.0.0.1:18071:18071 --cpus=2 --memory=8g \
            --mount source=soul-local-model-cache,target=/root/.cache/huggingface \
            -e SOUL_FUSION_MODEL_TOKEN="$SOUL_FUSION_MODEL_TOKEN" -e SOUL_LOCAL_MODEL_ID="$SOUL_LOCAL_MODEL_ID" -e SOUL_LOCAL_MODEL_SHA="$SOUL_LOCAL_MODEL_SHA" \
            -e TRANSFORMERS_SOURCE_SHA="$TRANSFORMERS_SHA" -e PYTORCH_SOURCE_SHA="$PYTORCH_SOURCE_SHA" -e SOUL_LOCAL_MODEL_PORT=18071 -e SOUL_LOCAL_MODEL_HOST=0.0.0.0 \
            --entrypoint python soul-transformers-pytorch-cpu:ci /app/infer.py --serve
          for i in $(seq 1 90); do if curl -fsS http://127.0.0.1:18071/health; then break; fi; sleep 2; done
          curl -fsS http://127.0.0.1:18071/health
      - name: Start local Transformers + PyTorch structured-artifact generator
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name soul-local-generator --network soul-fusion-e2e --publish 127.0.0.1:18072:18072 --cpus=2 --memory=8g \
            --mount source=soul-local-generation-cache,target=/root/.cache/huggingface \
            -e SOUL_FUSION_MODEL_TOKEN="$SOUL_FUSION_MODEL_TOKEN" \
            -e SOUL_LOCAL_GENERATION_MODEL_ID="google/flan-t5-small" \
            -e SOUL_LOCAL_GENERATION_PORT=18072 \
            -e TRANSFORMERS_SOURCE_SHA="$TRANSFORMERS_SHA" -e PYTORCH_SOURCE_SHA="$PYTORCH_SOURCE_SHA" \
            --entrypoint python soul-transformers-pytorch-cpu:ci /app/generate.py --serve
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18072/health > "$RUNNER_TEMP/generator-health.json"; then break; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/generator-health.json"
          python3 - "$RUNNER_TEMP/generator-health.json" <<'PY'
          import json,sys
          health=json.load(open(sys.argv[1],encoding="utf-8"))
          assert health.get("ready") is True
          assert health.get("provider")=="local-transformers-pytorch-seq2seq"
          assert len(health.get("model_sha",""))==40
          PY
      - name: Local model generates one structured artifact without external API
        shell: bash
        run: |
          set -euo pipefail
          TRACE_ID="$(openssl rand -hex 16)"
          python3 - "$TRACE_ID" > "$RUNNER_TEMP/local-artifact-request.json" <<'PY'
          import json,sys
          trace=sys.argv[1]
          print(json.dumps({
            "model":"local-flan-t5-small",
            "messages":[{"role":"user","content":
              "Write a short structured software PRD in Markdown. Include sections Objective, Assumptions, Architecture, Acceptance Criteria, Validation Tests, Risks. "
              "Project: SOUL routes a request from N01 through N07 authorization and a two-node LangGraph runtime into a local CPU model. "
              "Require trace_id/correlation_id equality, persistent SQLite checkpoint recovery after process restart, "
              "and 10 direct versus 10 fused benchmark samples. Avoid claiming any untested capability."}],
            "max_tokens":192,
            "trace_id":trace,
            "correlation_id":trace
          }))
          PY
          curl -fsS -X POST http://127.0.0.1:18072/v1/chat/completions \
            -H "Authorization: Bearer $SOUL_FUSION_MODEL_TOKEN" \
            -H "Content-Type: application/json" \
            -H "X-Soul-Trace-Id: $TRACE_ID" -H "X-Correlation-Id: $TRACE_ID" \
            --data-binary @"$RUNNER_TEMP/local-artifact-request.json" | tee "$RUNNER_TEMP/local-artifact-response.json"
          python3 - "$RUNNER_TEMP/local-artifact-response.json" "$TRACE_ID" "$RUNNER_TEMP/soul-local-prd.md" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1],encoding="utf-8"))
          trace=sys.argv[2]
          choices=result.get("choices") or []
          assert choices and isinstance(choices[0].get("message",{}).get("content"),str)
          content=choices[0]["message"]["content"].strip()
          assert len(content)>=40, "LOCAL_ARTIFACT_EMPTY_OR_TOO_SHORT"
          metadata=result.get("soul_trace",{})
          assert metadata.get("trace_id")==trace and metadata.get("correlation_id")==trace
          assert len(metadata.get("model_sha",""))==40
          open(sys.argv[3],"w",encoding="utf-8").write(content+"\n")
          print(json.dumps({"event":"group_a.local_artifact.completed","status":"PASS",
            "trace_id":trace,"correlation_id":trace,"provider":metadata.get("provider"),
            "model":result.get("model"),"model_sha":metadata.get("model_sha"),
            "latency_ms":metadata.get("latency_ms"),"output_chars":len(content),
            "output_literal":content,"exit_code":0},ensure_ascii=False))
          PY
      - name: Build and start isolated LangGraph at frozen upstream SHA
        run: |
          set -euo pipefail
          docker build --pull --build-arg LANGGRAPH_SHA="$LANGGRAPH_UPSTREAM_SHA" -t soul-langgraph-adapter:ci integrations/langgraph-runtime
          docker run --detach --name soul-langgraph-adapter --network soul-fusion-e2e --publish 127.0.0.1:18070:18070 \
            --mount source=soul-langgraph-checkpoint-cache,target=/var/lib/soul-langgraph \
            -e SOUL_LANGGRAPH_CHECKPOINT_DB=/var/lib/soul-langgraph/checkpoints.sqlite \
            -e SOUL_FUSION_MODEL_TOKEN="$SOUL_FUSION_MODEL_TOKEN" -e SOUL_LOCAL_MODEL_URL=http://soul-local-model:18071 \
            -e LANGGRAPH_UPSTREAM_SHA="$LANGGRAPH_UPSTREAM_SHA" soul-langgraph-adapter:ci
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:18070/health; then break; fi; sleep 2; done
          curl -fsS http://127.0.0.1:18070/health
      - name: Build real N07 from frozen SOUL source SHA and add trace logging
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/divibisoul/Orquestrador-.git "$RUNNER_TEMP/Orquestrador-"
          git -C "$RUNNER_TEMP/Orquestrador-" checkout --detach 5fd4e95d4e2bffb7fd1028da00cdbf7b4f66e49a
          test "$(git -C "$RUNNER_TEMP/Orquestrador-" rev-parse HEAD)" = "5fd4e95d4e2bffb7fd1028da00cdbf7b4f66e49a"
          python3 - "$RUNNER_TEMP/Orquestrador-/mesh/http.go" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          if '"log"' not in s: s=s.replace('"fmt"','"fmt"\n\t"log"',1)
          nonce_marker='\tenvelope := normalizedMeshEnvelope(wire)'
          nonce_line='\twire.Nonce = strings.TrimSpace(r.Header.Get("x-soul-mesh-nonce"))\n'
          if nonce_marker not in s: raise SystemExit("N07_HEADER_NONCE_INSERTION_POINT_MISSING")
          if 'wire.Nonce = strings.TrimSpace(r.Header.Get("x-soul-mesh-nonce"))' not in s: s=s.replace(nonce_marker,nonce_line+nonce_marker,1)
          marker='\tif envelope.Target != "N07" && envelope.Target != "BROADCAST" {'
          line='\tlog.Printf("SOUL_TRACE n07.authorized trace_id=%s correlation_id=%s capability=%s", envelope.CorrelationID, envelope.CorrelationID, canonicalCapability(wire))\n'
          if marker not in s: raise SystemExit("N07_TRACE_INSERTION_POINT_MISSING")
          if 'SOUL_TRACE n07.authorized' not in s: s=s.replace(marker,line+marker,1)
          p.write_text(s)
          PY
          (cd "$RUNNER_TEMP/Orquestrador-" && go build -trimpath -o "$RUNNER_TEMP/soul-n07" ./cmd/nexus)
          echo "N07_SOURCE_SHA=$(git -C "$RUNNER_TEMP/Orquestrador-" rev-parse HEAD)"
      - name: Start N07 Mesh authorization service
        run: |
          set -euo pipefail
          SOUL_MESH_HMAC_SECRET="$SOUL_MESH_SECRET" N07_APP_TOKEN="$(openssl rand -hex 32)" N07_HTTP_ADDR="$N07_HTTP_ADDR" \
            "$RUNNER_TEMP/soul-n07" > "$RUNNER_TEMP/n07-runtime.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/n07-runtime.pid"
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:18090/health; then exit 0; fi; sleep 1; done
          cat "$RUNNER_TEMP/n07-runtime.log"; exit 1
      - name: Start N01 Mesh HTTP gateway
        run: |
          set -euo pipefail
          SOUL_MESH_SECRET="$SOUL_MESH_SECRET" SOUL_MESH_N07_URL="$SOUL_MESH_N07_URL" SOUL_FUSION_EXECUTION_TOKEN="$SOUL_FUSION_EXECUTION_TOKEN" \
            SOUL_FUSION_MODEL_URL="$SOUL_FUSION_MODEL_URL" SOUL_FUSION_MODEL_TOKEN="$SOUL_FUSION_MODEL_TOKEN" SOUL_FUSION_MODEL_PROVIDER=local-transformers-pytorch \
            SOUL_FUSION_EXECUTION_ENABLED=true SOUL_MESH_N01_PORT=18080 SOUL_MESH_N01_HOST=127.0.0.1 node scripts/soul-mesh-server-entry.mjs > "$RUNNER_TEMP/n01-mesh.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/n01-mesh.pid"
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:18080/api/soul-mesh/health; then exit 0; fi; sleep 1; done
          cat "$RUNNER_TEMP/n01-mesh.log"; exit 1
      - name: Group A — SQLite checkpoint survives process restart and resumes
        shell: bash
        run: |
          set -euo pipefail
          THREAD_ID="soul-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          TRACE_ID="$(openssl rand -hex 16)"
          python3 - "$THREAD_ID" "$TRACE_ID" > "$RUNNER_TEMP/checkpoint-prepare.json" <<'PY'
          import json,sys
          thread_id,trace=sys.argv[1],sys.argv[2]
          print(json.dumps({"thread_id":thread_id,"trace_id":trace,"correlation_id":trace,
            "text":"The movie was excellent and the acting was wonderful.",
            "authorization":{"status":"authorized","nucleus_id":"N07","capability":"mesh.ping",
              "trace_id":trace,"correlation_id":trace}}))
          PY
          curl -fsS -X POST http://127.0.0.1:18070/checkpoint/prepare \
            -H "Authorization: Bearer $SOUL_FUSION_MODEL_TOKEN" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/checkpoint-prepare.json" | tee "$RUNNER_TEMP/checkpoint-prepare-result.json"
          grep -q '"status":"INTERRUPTED"' "$RUNNER_TEMP/checkpoint-prepare-result.json"
          python3 - "$THREAD_ID" "$TRACE_ID" > "$RUNNER_TEMP/checkpoint-resume.json" <<'PY'
          import json,sys
          print(json.dumps({"thread_id":sys.argv[1],"trace_id":sys.argv[2],"correlation_id":sys.argv[2]}))
          PY
          docker restart soul-langgraph-adapter
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18070/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18070/health | grep -q '"checkpointer":"sqlite"'
          curl -fsS -X POST http://127.0.0.1:18070/checkpoint/resume \
            -H "Authorization: Bearer $SOUL_FUSION_MODEL_TOKEN" -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/checkpoint-resume.json" | tee "$RUNNER_TEMP/checkpoint-resume-result.json"
          grep -q '"status":"PASS"' "$RUNNER_TEMP/checkpoint-resume-result.json"
          grep -q '"resume_after_process_restart":true' "$RUNNER_TEMP/checkpoint-resume-result.json"
      - name: Group A — real N01 -> N07 authorization -> LangGraph -> local PyTorch response
        run: node scripts/soul-fusion-e2e-minimal.mjs
      - name: Synergy — measure 10 direct versus 10 fused local-model requests
        run: node scripts/soul-fusion-synergy.mjs | tee "$RUNNER_TEMP/soul-fusion-synergy.json"
      - name: Emit trace-correlated execution logs
        if: always()
        run: |
          echo "=== N01 ==="; cat "$RUNNER_TEMP/n01-mesh.log" 2>/dev/null || true
          echo "=== N07 ==="; cat "$RUNNER_TEMP/n07-runtime.log" 2>/dev/null || true
          echo "=== LangGraph ==="; docker logs soul-langgraph-adapter 2>&1 || true
          echo "=== Group F Transformers + PyTorch CPU service ==="; docker logs soul-local-model 2>&1 || true
          docker rm -f soul-langgraph-adapter soul-local-model soul-local-generator >/dev/null 2>&1 || true
          docker network rm soul-fusion-e2e >/dev/null 2>&1 || true
          docker volume rm soul-local-model-cache soul-local-generation-cache soul-langgraph-checkpoint-cache >/dev/null 2>&1 || true
