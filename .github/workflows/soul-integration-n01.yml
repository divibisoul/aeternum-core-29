name: SOUL Integration CI - N01
on:
  push:
    branches: [main, feat/n01-soul25-integration-20261003]
  pull_request:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Validate identity
        run: test -s SOUL_ECOSYSTEM.md
      - name: Validate submodule paths
        shell: bash
        run: |
          set -e
          if test -f .gitmodules; then
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' | while read p; do test -e "$p"; done
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate N01 25-source fabric
        run: bun run upstream:fabric:check
      - name: Validate fusion contract
        run: bun run fusion:check
      - name: Validate SuperGPU contract
        run: bun run supergpu:check
      - name: Validate N01 authority
        run: bun run aeternum:authority:check
      - name: Validate resident agent contract
        shell: bash
        run: |
          node --input-type=module -e "import('./scripts/soul-resident-agent.mjs').then(m=>{const a=m.describeN01ResidentAgent(); if(a.nucleus!=='N01'||a.lifecycle!=='BOUND'||a.upstreamProviderCount!==25) process.exit(1); console.log(JSON.stringify(a))})"
