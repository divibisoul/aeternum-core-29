name: Temporary runner recovery

on:
  push:
    branches: ["fusion/phase-zero-canon-20261019"]
    paths:
      - ".github/workflows/temporary-runner-recovery.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: temporary-runner-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-and-dispatch-critical-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel all other queued, pending, and running jobs in this repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs"
          accepted=0
          inspected=0
          for page in $(seq 1 20); do
            response="$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api?per_page=100&page=$page")"
            count="$(jq '.workflow_runs | length' <<< "$response")"
            [[ "$count" -gt 0 ]] || break
            while IFS= read -r id; do
              [[ -n "$id" ]] || continue
              inspected=$((inspected+1))
              status="$(curl -sSL -o "$RUNNER_TEMP/cancel-response.json" -w '%{http_code}' \
                -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api/$id/cancel")"
              case "$status" in
                202|200)
                  accepted=$((accepted+1))
                  echo "CANCEL_ACCEPTED run_id=$id http=$status"
                  ;;
                409|422)
                  echo "CANCEL_RACE_OR_NOT_CANCELLABLE run_id=$id http=$status"
                  ;;
                *)
                  echo "CANCEL_FAILED run_id=$id http=$status"
                  cat "$RUNNER_TEMP/cancel-response.json"
                  exit 1
                  ;;
              esac
            done < <(jq -r --arg self "$GITHUB_RUN_ID" '
              .workflow_runs[]
              | select((.id|tostring) != $self)
              | select(.status == "queued" or .status == "in_progress" or .status == "pending")
              | .id' <<< "$response")
          done
          echo "CANCEL_SCAN_COMPLETE current_run=$GITHUB_RUN_ID other_runs_inspected=$inspected cancel_requests_accepted=$accepted"
      - name: Dispatch exactly the three critical workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows"
          ref="fusion/phase-zero-canon-20261019"
          for workflow in soul-fusion-e2e-minimal.yml android-build.yml soul-n01-validation.yml; do
            code="$(curl -sSL -o "$RUNNER_TEMP/dispatch-response.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/$workflow/dispatches" \
              -d "{\"ref\":\"$ref\"}")"
            if [[ "$code" != "204" ]]; then
              echo "DISPATCH_FAILED workflow=$workflow http=$code"
              cat "$RUNNER_TEMP/dispatch-response.json"
              exit 1
            fi
            echo "WORKFLOW_DISPATCHED=$workflow ref=$ref http=$code"
          done
