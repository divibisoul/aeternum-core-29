name: Execução Completa do SOUL - Auto-reparação Evolutiva

on:
  workflow_dispatch:
  push:
    branches: [ main, principal ]

env:
  # Credenciais (configure nos secrets do repositório)
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  BYOK_KEY: ${{ secrets.BYOK_KEY }}
  # URLs dos núcleos (também em secrets)
  NUCLEO_N01: ${{ secrets.NUCLEO_N01 }}
  NUCLEO_N02: ${{ secrets.NUCLEO_N02 }}
  NUCLEO_N03: ${{ secrets.NUCLEO_N03 }}
  NUCLEO_N04: ${{ secrets.NUCLEO_N04 }}
  NUCLEO_N05: ${{ secrets.NUCLEO_N05 }}
  NUCLEO_N06: ${{ secrets.NUCLEO_N06 }}
  NUCLEO_N07: ${{ secrets.NUCLEO_N07 }}   # Orquestrador com GPU
  MAX_RETRIES: 3

jobs:
  soul-validator-e-evolver:
    runs-on: ubuntu-latest
    # Se tiver runner com GPU, mude para: runs-on: [self-hosted, gpu]
    timeout-minutes: 60

    steps:
      # --------------------------------------------------------------
      # 1. Preparação do ambiente
      # --------------------------------------------------------------
      - name: Baixar código do repositório (incluindo submódulos)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências do sistema e Python
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential curl jq
          pip install --upgrade pip setuptools wheel
          # Instala bibliotecas necessárias para validação (Supabase, testes, etc.)
          pip install supabase-py pytest requests numpy python-dotenv
          # Se houver GPU, instala torch com CUDA, senão CPU
          if command -v nvidia-smi &> /dev/null; then
            pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu118
          else
            pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          fi
          # Dependências dos núcleos (se existirem requirements.txt)
          for nucleo in N01 N02 N03 N04 N05 N06 N07; do
            if [ -f "nucleos/$nucleo/requirements.txt" ]; then
              pip install -r nucleos/$nucleo/requirements.txt
            fi
          done

      # --------------------------------------------------------------
      # 2. Validação da Soul Mesh (conectividade e latência)
      # --------------------------------------------------------------
      - name: Validar Soul Mesh
        id: mesh
        run: |
          echo "=== Validação da Malha Sináptica (Soul Mesh) ==="
          # Lista de URLs dos núcleos
          NUCLEOS="$NUCLEO_N01 $NUCLEO_N02 $NUCLEO_N03 $NUCLEO_N04 $NUCLEO_N05 $NUCLEO_N06 $NUCLEO_N07"
          FAIL=0
          for url in $NUCLEOS; do
            if [ -z "$url" ]; then
              echo "❌ URL vazia para um núcleo. Verifique os secrets."
              FAIL=1
              continue
            fi
            # Testa health com timeout de 5s e mede latência
            START=$(date +%s%N)
            if curl -f -s -o /dev/null --connect-timeout 5 "$url/health"; then
              END=$(date +%s%N)
              LATENCY=$(( ($END - $START) / 1000000 )) # ms
              if [ $LATENCY -gt 200 ]; then
                echo "⚠️  $url - latência alta: ${LATENCY}ms"
              else
                echo "✅ $url - OK (${LATENCY}ms)"
              fi
            else
              echo "❌ $url - falha na conexão"
              FAIL=1
            fi
          done
          if [ $FAIL -ne 0 ]; then
            echo "Mesh com falhas."
            exit 1
          fi
          echo "Mesh validada com sucesso."

      # --------------------------------------------------------------
      # 3. Validação da Memória Vetorial (Supabase) e BYOK
      # --------------------------------------------------------------
      - name: Validar Memória Vetorial e BYOK
        id: memory
        run: |
          echo "=== Validação da Memória Episódica (Supabase) e BYOK ==="
          # Teste de conexão Supabase usando Python inline
          python -c "
          import os, sys, json, base64
          from supabase import create_client
          url = os.getenv('SUPABASE_URL')
          key = os.getenv('SUPABASE_KEY')
          byok = os.getenv('BYOK_KEY')
          if not url or not key:
              print('❌ SUPABASE_URL ou SUPABASE_KEY não definidos')
              sys.exit(1)
          try:
              supabase = create_client(url, key)
              # Tenta ler a tabela 'memoria_episodica' (crie se não existir)
              resp = supabase.table('memoria_episodica').select('id').limit(1).execute()
              print('✅ Conexão Supabase OK')
          except Exception as e:
              print(f'❌ Erro Supabase: {e}')
              sys.exit(1)
          # Valida BYOK (deve ser base64 de 32 bytes)
          try:
              decoded = base64.b64decode(byok)
              if len(decoded) != 32:
                  raise ValueError('Tamanho inválido')
              print('✅ BYOK válida (AES-256)')
          except Exception as e:
              print(f'❌ BYOK inválida: {e}')
              sys.exit(1)
          # Teste de inserção/busca vetorial (dummy)
          try:
              import numpy as np
              dummy = np.zeros(768).tolist()
              # Insere
              insert = supabase.table('memoria_episodica').insert({'embedding': dummy, 'metadata': {'test': True}}).execute()
              if not insert.data:
                  raise Exception('Falha na inserção')
              inserted_id = insert.data[0]['id']
              # Busca por similaridade (rpc match_vectors)
              search = supabase.rpc('match_vectors', {'query_embedding': dummy, 'match_threshold': 0.9, 'limit': 1}).execute()
              if not search.data:
                  raise Exception('Falha na busca')
              # Remove
              supabase.table('memoria_episodica').delete().eq('id', inserted_id).execute()
              print('✅ Operações vetoriais OK')
          except Exception as e:
              print(f'❌ Erro no teste vetorial: {e}')
              sys.exit(1)
          print('Validação de memória e BYOK concluída com sucesso.')
          "

      # --------------------------------------------------------------
      # 4. Build e testes de cada núcleo (N01-N07)
      # --------------------------------------------------------------
      - name: Build e testes dos núcleos
        id: build
        run: |
          echo "=== Construção e testes dos 7 núcleos ==="
          for nucleo in N01 N02 N03 N04 N05 N06 N07; do
            echo "--- Núcleo $nucleo ---"
            cd nucleos/$nucleo
            # Se houver Makefile, compila
            if [ -f "Makefile" ]; then
              make clean
              make build
            elif [ -f "setup.py" ]; then
              python setup.py clean --all
              python setup.py build_ext --inplace
            else
              echo "⚠️  Nenhum sistema de build encontrado para $nucleo, pulando."
            fi
            # Executa testes unitários (se houver pasta tests)
            if [ -d "tests" ]; then
              pytest tests/ --junitxml=../../test-reports/$nucleo.xml || exit 1
            else
              echo "ℹ️  Sem testes unitários para $nucleo."
            fi
            cd ../..
          done
          echo "Build e testes concluídos."

      # --------------------------------------------------------------
      # 5. Teste de orquestração (N07 com GPU)
      # --------------------------------------------------------------
      - name: Teste de orquestração (N07) com roteamento neural
        id: orchestration
        run: |
          echo "=== Teste do orquestrador N07 (neocórtex pré-frontal) ==="
          # Simula uma tarefa de inferência (exemplo: resumo de contexto)
          # Se tiver um script de teste, chame-o; senão, faz um curl simples.
          if [ -f "scripts/test_orchestrator.py" ]; then
            python scripts/test_orchestrator.py --orchestrator "$NUCLEO_N07" --task "resumo" --input '{"text": "SOUL é uma AGI distribuída..."}'
          else
            # Teste básico: verifica se o endpoint /orchestrate responde
            curl -f -s -X POST "$NUCLEO_N07/orchestrate" \
              -H "Content-Type: application/json" \
              -d '{"task": "ping"}' || exit 1
            echo "✅ Orquestrador respondeu."
          fi

      # --------------------------------------------------------------
      # 6. Consolidação (se tudo OK)
      # --------------------------------------------------------------
      - name: Consolidar versão e capacidades (se sucesso)
        if: success()
        run: |
          echo "=== Consolidando na linha canônica ==="
          # Gera um arquivo de versão com timestamp
          echo "SOUL_VERSION=$(date +'%Y%m%d-%H%M%S')" > version.txt
          # Se houver script de consolidação, execute
          if [ -f "scripts/consolidate.py" ]; then
            python scripts/consolidate.py --version-file version.txt --changelog CHANGELOG.md
          else
            echo "ℹ️  Nenhum script de consolidação, apenas registrando versão."
          fi
          # Opcional: commit do version.txt (cuidado com loops)
          # git config user.name "github-actions"
          # git config user.email "github-actions@github.com"
          # git add version.txt && git commit -m "chore: atualiza versão do SOUL" && git push

      # --------------------------------------------------------------
      # 7. REGRA DE OURO: Auto-reparação e upgrade em caso de falha
      # --------------------------------------------------------------
      - name: Protocolo de auto-reparação e upgrade evolutivo
        if: failure()
        id: repair
        run: |
          echo "⚠️  Falha detectada. Iniciando protocolo de auto-reparação."
          mkdir -p repair-logs
          ATTEMPT=0
          MAX_ATTEMPTS=${{ env.MAX_RETRIES }}
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT+1))
            echo "--- Tentativa de reparo $ATTEMPT/$MAX_ATTEMPTS ---"
            # Ações corretivas:
            # 1. Atualizar dependências
            pip install --upgrade -r requirements.txt 2>/dev/null || true
            # 2. Rodar linters e formatadores
            pip install black flake8 2>/dev/null || true
            black . 2>/dev/null || true
            flake8 . --max-line-length=120 --count --statistics 2>/dev/null || true
            # 3. Recompilar com otimizações
            for nucleo in N01 N02 N03 N04 N05 N06 N07; do
              if [ -f "nucleos/$nucleo/Makefile" ]; then
                make -C nucleos/$nucleo clean
                make -C nucleos/$nucleo build CFLAGS="-O3"
              fi
            done
            # 4. Tentar executar novamente os testes principais (usando os mesmos comandos)
            # Re-executa as validações (mas apenas os testes, não todo o workflow)
            echo "Reexecutando testes dos núcleos..."
            for nucleo in N01 N02 N03 N04 N05 N06 N07; do
              if [ -d "nucleos/$nucleo/tests" ]; then
                pytest nucleos/$nucleo/tests/ -v || exit_code=$?
                if [ $exit_code -ne 0 ]; then
                  echo "❌ Testes de $nucleo ainda falham."
                  break
                fi
              fi
            done
            if [ $? -eq 0 ]; then
              echo "✅ Reparo bem-sucedido na tentativa $ATTEMPT."
              # Se reparo funcionou, faz commit das correções
              git config user.name "github-actions"
              git config user.email "github-actions@github.com"
              git add . && git commit -m "fix: reparo automático (tentativa $ATTEMPT)" || true
              git push || true
              exit 0
            else
              echo "❌ Ainda há falhas após tentativa $ATTEMPT."
              # Log do erro
              echo "Falha persistente" >> repair-logs/attempt-$ATTEMPT.log
            fi
            sleep 5
          done
          # Se chegou aqui, todas as tentativas falharam
          echo "❌ Auto-reparação falhou após $MAX_ATTEMPTS tentativas."
          exit 1

      # --------------------------------------------------------------
      # 8. Upload de artefatos
      # --------------------------------------------------------------
      - name: Upload de relatórios e logs
        uses: actions/upload-artifact@v3
        with:
          name: soul-report
          path: |
            test-reports/*.xml
            repair-logs/*.log
            version.txt
          if-no-files-found: warn


          - name: Setup Java JDK
  uses: actions/setup-java@v6.0.0
  with:
    # The Java version to set up. Takes a whole or semver Java version, or the "latest" alias to use the newest available stable release. See examples of supported syntax in README file
    java-version: # optional
    # The path to a file containing the Java version to set up (.java-version, .tool-versions, .sdkmanrc). Used when java-version is not set. See examples of supported syntax in README file
    java-version-file: # optional
    # Java distribution. See the list of supported distributions in README file. This input is required except when java-version-file points to .sdkmanrc with a recognized distribution suffix (e.g., java=21.0.5-tem).
