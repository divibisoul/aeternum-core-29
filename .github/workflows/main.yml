name: SOUL – N01 real lifecycle validation

on:
  push:
    branches: [main, principal, 'feat/**']
  pull_request:
    branches: [main, principal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soul-n01-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-runtime:
    name: N01 static + runtime validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify declared runtime surface
        run: |
          test -f src/main.ts || test -f src/main.tsx || test -f src/main.js || test -f index.html
          test -f scripts/soul-mesh-server.mjs
          test -f scripts/soul-mesh-server-entry.mjs
          test -f scripts/soul-supergpu.mjs
          test -f scripts/sara-federation.mjs
          test -f scripts/n01-cognitive-delegation.mjs
          test -f scripts/n01-byok-gemini.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Core behavioral test
        run: node scripts/core-test.mjs

      - name: Mesh health unit test
        run: npm run mesh:health:unit

      - name: Mesh async executor unit test
        run: npm run mesh:async:unit

      - name: Mesh contract
        run: npm run mesh:contract:check

      - name: Fusion contract
        run: npm run fusion:check

      - name: SuperGPU contract
        run: npm run supergpu:check

      - name: BYOK behavioral check
        run: npm run byok:check

      - name: Vector memory behavioral check
        run: npm run vector-memory:check

      - name: SARA federation behavioral check
        run: npm run sara:federation:check

      - name: Deterministic N01 startup probe
        run: node scripts/soul-mesh-startup-probe.mjs
