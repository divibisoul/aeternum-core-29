name: SOUL – Ciclo de Vida Completo (Validação, Reparo, Regeneração e Manutenção)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: "Ação solicitada"
        required: true
        default: validate
        type: choice
        options:
          - validate
          - repair
          - regenerate
          - maintenance
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  canonical-validation:
    name: Canonical N01 validation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Mesh contract check
        run: npm run mesh:contract:check

      - name: Mesh health unit
        run: npm run mesh:health:unit

      - name: Mesh async unit
        run: npm run mesh:async:unit

      - name: Canonical transport registry unit
        run: npm run mesh:transport:unit

      - name: BYOK behavioral check
        run: npm run byok:check

      - name: Vector memory behavioral check
        run: npm run vector-memory:check

      - name: Local Mesh runtime contract
        run: node scripts/soul-mesh-local-contract-check.mjs
      - name: Protocol HMAC compatibility check
        run: node scripts/test-n01-protocol-hmac.mjs

      - name: SuperGPU registry contract
        run: node scripts/soul-supergpu-check.mjs

      - name: Preserve and syntax-check legacy N07 orchestrator
        run: python -m py_compile scripts/orchestrator_n07_optimized.py

      - name: Record requested lifecycle action
        run: |
          echo "requested_action=${{ inputs.action || 'validate' }}"
          echo "execution_mode=non-destructive-validation"
          echo "automatic_branch_deletion=false"
          echo "automatic_repository_push=false"

  maintenance-audit:
    name: Read-only maintenance audit
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'maintenance')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inventory branches without mutation
        run: |
          git fetch --all --prune
          echo "=== Branch inventory ==="
          git branch -r --no-merged origin/main || true
          echo "=== Merged branch inventory (reported only) ==="
          git for-each-ref --format='%(refname:short) %(objectname:short)' refs/remotes/origin/ | sort

      - name: Security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          ignore-unfixed: true

      - name: Write maintenance evidence
        run: |
          {
            echo "# SOUL maintenance audit"
            echo
            echo "Mode: READ_ONLY"
            echo "No branches, PRs, files, dependencies or repository refs were deleted or pushed by this workflow."
            echo
            echo "Timestamp: $(date -u)"
          } > maintenance-audit.txt

      - name: Upload maintenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: soul-maintenance-audit-${{ github.run_id }}
          path: maintenance-audit.txt
