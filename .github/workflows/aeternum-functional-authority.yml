name: Aeternum Functional Authority
# Revalidation after immutable snapshot publication

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify functional authority graph
        run: node --experimental-strip-types scripts/n01-aeternum-functional-authority-check.mjs
