name: Soul Android validation and APK release
on:
  push:
    paths:
      - 'soul-sentinel/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle assembleDebug
      - run: gradle test
      - run: gradle assembleRelease
      - name: Verify APKs
        working-directory: .
        run: |
          test -f soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
          test -f soul-sentinel/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soul-apks
          path: |
            soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
            soul-sentinel/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
