name: Soul Android validation

on:
  push:
    paths:
      - 'soul-sentinel/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'soul-sentinel/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: soul-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - run: gradle test
