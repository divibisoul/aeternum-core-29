name: N01 NeuralManagementCore current

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Execute current NeuralManagementCore integration
        run: node scripts/neural-management-core-check-current.mjs
