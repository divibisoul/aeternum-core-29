name: SOUL 25 Capability Upgrade - N01

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Install locked N01 dependencies
        run: bun install --frozen-lockfile
      - name: Validate 25-source N01 capability fabric and preserved native topology
        run: |
          python - <<'PY'
          import json
          import re

          d = json.load(open('integrations/soul-25-augmentation.json'))
          providers = d['external_providers']
          peers = d['soul_peers']
          assert d['external_provider_count'] == 25, f"provider_count={d['external_provider_count']}"
          assert len(providers) == 25, f"providers={len(providers)}"
          assert len({p['id'] for p in providers}) == 25, 'duplicate provider IDs'
          assert d['soul_peer_count'] == 9
          assert len(peers) == 9
          assert len(set(peers)) == 9, 'duplicate native peer identities'
          assert d['native_authority'] == 'preserved'
          assert d['graph'] == 'SOUL-34-capability-fabric'
          for p in providers:
              assert p['id'] and p['capabilities'], f"missing identity/capabilities: {p.get('id')}"
              assert p['access'] == 'N01 capability fabric', f"access drift: {p['id']}"
              assert p['structural_state'] == 'REAL', f"structural state drift: {p['id']}"
              assert p['runtime_state'] == 'PROJECTED', f"unproven runtime promoted: {p['id']}"
              assert p['requires_adapter'] is True, f"adapter contract missing: {p['id']}"
              assert p['source'].startswith('https://github.com/'), f"non-public source: {p['id']}"
              assert re.fullmatch(r'[0-9a-fA-F]{40}', p['revision']), f"unpinned source: {p['id']}"
              assert p['owner'] and p['targets'], f"native ownership/targets missing: {p['id']}"
          print('N01 FABRIC: 25/25 pinned public sources; native peer topology: 9/9 preserved; runtime success: not claimed.')
          PY
      - name: Test N01 manifest-backed upstream capability fabric
        run: bun run upstream:fabric:check
