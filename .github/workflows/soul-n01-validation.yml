name: SOUL N01 validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sync npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "chore(N01): synchronize npm lockfile [skip ci]"
          git push
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: node --check scripts/n01-byok-gemini.mjs
      - run: node --check scripts/soul-mesh-server.mjs
      - run: node --check scripts/supabase-vector-memory.mjs
      - run: npm run mesh:contract:check
      - run: npm run byok:check
      - run: npm run vector-memory:check
