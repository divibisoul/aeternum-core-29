name: SOUL N01 validation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'upgrade/**'
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:soul-transport
      - run: npm run build
      - run: npm run lint
