name: SOUL N01 validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: node --check scripts/n01-byok-gemini.mjs
      - run: node --check scripts/soul-mesh-server.mjs
      - run: node --check scripts/supabase-vector-memory.mjs
      - run: npm run mesh:contract:check
      - run: npm run mesh:health:unit
      - run: npm run mesh:async:unit
      - run: node --check scripts/test-n01-n06.mjs
      - run: npm run byok:check
      - run: npm run vector-memory:check
