name: N01 lock repair

on:
  push:
    branches:
      - feat/phase2-block1-core-2026-09-25
    paths:
      - package.json
      - scripts/soul-mesh-startup-probe.mjs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n01-lock-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Persist lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(n01): persist reconciled npm lockfile"
          git push origin HEAD:feat/phase2-block1-core-2026-09-25
