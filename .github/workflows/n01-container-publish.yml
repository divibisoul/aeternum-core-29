name: N01 container build and publication

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'integrations/soul-25-augmentation.json'
      - 'scripts/soul-mesh-server*.mjs'
      - 'scripts/soul-mesh-relay-policy.mjs'
      - 'scripts/soul-mesh-canonical-json.mjs'
      - 'src/core/mesh/SoulMeshRuntime.ts'
      - 'src/core/fusion/N01ExternalCapabilityFabric.ts'
      - '.github/workflows/n01-container-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    name: Build container and test real N01 health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the actual N01 runtime container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: soul-n01-mesh:smoke-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the N01 container
        run: docker run -d --name soul-n01-mesh-smoke -p 18080:8080 soul-n01-mesh:smoke-${{ github.sha }}

      - name: Verify live N01 health contract
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:18080/mesh/health').then(async r => { if (!r.ok) process.exit(1); const b = await r.json(); process.exit(b.ok === true && b.nucleus === 'N01' ? 0 : 1); }).catch(() => process.exit(1));"; then
              echo "N01_CONTAINER_HEALTH: PASS"
              exit 0
            fi
            sleep 2
          done
          docker logs soul-n01-mesh-smoke || true
          echo "N01_CONTAINER_HEALTH: FAILED"
          exit 1

      - name: Verify the container advertises the canonical external fabric safely
        run: |
          set -eu
          node --input-type=module <<'NODE'
          const response = await fetch('http://127.0.0.1:18080/api/soul-mesh/health');
          if (!response.ok) throw new Error('unexpected optional health route response: ' + response.status);
          NODE
        continue-on-error: true

      - name: Capture container logs on failure
        if: failure()
        run: docker logs soul-n01-mesh-smoke || true

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force soul-n01-mesh-smoke || true

  publish:
    name: Publish image to GitHub Container Registry
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR with GitHub's workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the verified N01 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
