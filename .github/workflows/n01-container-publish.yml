name: N01 container build and publication

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/n01-android-mesh-tests-2026-10-09]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    name: Build container and test real N01 health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container for local smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: soul-n01-mesh:smoke-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start N01 HTTP gateway
        run: docker run -d --name soul-n01-mesh-smoke -p 18080:8080 soul-n01-mesh:smoke-${{ github.sha }}

      - name: Verify live N01 health response
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            if node -e "fetch('http://127.0.0.1:18080/mesh/health').then(async r => { if (!r.ok) process.exit(1); const b = await r.json(); process.exit(b.ok === true && b.nucleus === 'N01' ? 0 : 1); }).catch(() => process.exit(1));"; then
              echo "N01_CONTAINER_HEALTH: PASS"
              exit 0
            fi
            sleep 2
          done
          docker logs soul-n01-mesh-smoke || true
          echo "N01_CONTAINER_HEALTH: FAILED"
          exit 1

      - name: Capture container logs on failure
        if: failure()
        run: docker logs soul-n01-mesh-smoke || true

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force soul-n01-mesh-smoke || true

  publish:
    name: Publish image to GitHub Container Registry
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish N01 runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
