name: N01 NeuralManagementCore verification

on:
  push:
    branches:
      - "feat/reintegrate-neural-management-core-2026-09-28"
  pull_request:
    branches: [main]
    paths:
      - "src/core/agi/NeuralManagementCore.ts"
      - "src/core/agi/index.ts"
      - "scripts/neural-management-core-check.mjs"
      - ".github/workflows/n01-neural-management-core.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute real NeuralManagementCore check
        run: node --experimental-strip-types scripts/neural-management-core-check.mjs
