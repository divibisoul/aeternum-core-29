name: Soul N01 Full Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web TypeScript / Vite validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Sync Bun lockfile
        run: bun install --no-save
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- bun.lock; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bun.lock
          git commit -m "chore(N01): synchronize bun lockfile [skip ci]"
          git push
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build

  android:
    name: Android APK + Mesh instrumentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: soul-sentinel
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release APK
        working-directory: soul-sentinel
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK outputs
        run: |
          test -s soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
          test -s soul-sentinel/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Run Mesh instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: soul-sentinel
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: soul-apks
          path: |
            soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
            soul-sentinel/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
