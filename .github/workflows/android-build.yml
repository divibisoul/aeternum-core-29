name: Soul N01 Full Build

on:
  push:
    branches: [ main ]
  pull_request:
    # Also validate stacked N01 PRs whose base is another working branch.
    paths:
      - 'soul-sentinel/**'
      - 'src/**'
      - 'lib/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'config/**'
      - 'package.json'
      - 'bun.lock'
      - 'bun.lockb'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'index.html'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/android-build.yml'
      - '.github/workflows/soul-mesh-regression.yml'
      - '.github/workflows/soul-n01-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web TypeScript / Vite validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: N01 canonical route-resolution regressions
        run: node --test scripts/soul-mesh-routing.test.mjs
      - name: N01 Mesh contract checks
        run: node scripts/soul-mesh-contract-check.mjs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install web dependencies
        run: bun install --no-save
      - name: Lint
        run: bun run lint
      - name: Production build
        run: bun run build

  android:
    name: Android APK + Mesh instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: soul-sentinel
        run: gradle :app:assembleDebug --stacktrace
      - name: Build release APK
        working-directory: soul-sentinel
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK outputs
        run: |
          test -s soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
          test -s soul-sentinel/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Stop Gradle daemons before emulator boot
        working-directory: soul-sentinel
        run: gradle --stop
      - name: Run Mesh instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Fail fast on a boot fault. 600 seconds matches the action's current default.
          emulator-boot-timeout: 600
          force-avd-creation: true
          # swiftshader_indirect is deprecated; use the supported SwiftShader software renderer.
          emulator-options: -no-window -gpu swiftshader -no-snapshot -wipe-data -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048 -cores 2
          disable-animations: true
          disable-linux-hw-accel: auto
          working-directory: soul-sentinel
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Upload APKs and instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soul-android-evidence
          path: |
            soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
            soul-sentinel/app/build/outputs/apk/release/app-release-unsigned.apk
            soul-sentinel/app/build/reports/androidTests/connected/**
            soul-sentinel/app/build/outputs/androidTest-results/connected/**
            soul-sentinel/app/build/test-results/connectedAndroidTest/**
          if-no-files-found: warn
