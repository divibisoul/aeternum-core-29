name: Soul Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: soul-sentinel
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: test -s soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: soul-admin-debug
          path: soul-sentinel/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
