name: Recovered Aeternum continuity verification
on:
  push:
    branches:
      - "feat/recovered-aeternum-horta-continuity-2026-09-28"
  pull_request:
    branches:
      - "recovery/cycle3-buried-functions-2026-09-28"
    paths:
      - "lib/aeternum/**"
      - "src/core/index.ts"
      - "src/core/hortaCore.ts"
      - "scripts/recovered-aeternum-continuity-check.mjs"
      - ".github/workflows/recovered-aeternum-continuity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/recovered-aeternum-continuity-check.mjs
