name: N01 Core Continuity Restoration Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fase0/n01-core-continuity-main-2026-09-30

jobs:
  continuity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # MAIN currently has package.json/package-lock.json drift (npm ci fails on picomatch).
      # Use the project's actual npm resolver for this code-validation gate and keep
      # the dependency drift visible in the broader Fase 0 report rather than hiding it.
      - run: npm install --no-audit --no-fund
      - run: node --experimental-strip-types scripts/n01-core-continuity-check.mjs
      - run: npm run build
