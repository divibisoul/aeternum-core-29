name: Audit diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'

jobs:
  diagnose:
    name: Deep runner and project diagnostics
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: FIRST EXECUTION STEP - runner bootstrap capture
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/n01-bootstrap"
          {
            echo '=== bootstrap timestamp ==='; date -u
            echo '=== runner identity ==='
            printf 'RUNNER_OS=%s\nRUNNER_ARCH=%s\nRUNNER_NAME=%s\nRUNNER_TEMP=%s\nRUN_ID=%s\nATTEMPT=%s\nSHA=%s\nREF=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$RUNNER_NAME" "$RUNNER_TEMP" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$GITHUB_REF"
            echo '=== versions ==='; command -v node || true; node --version || true; command -v npm || true; npm --version || true; git --version || true
            echo '=== system ==='; uname -a || true; cat /etc/os-release || true
            echo '=== resources ==='; nproc || true; free -h || true; df -hT || true
            echo '=== processes ==='; ps -ef || true
            echo '=== environment names ==='; env | cut -d= -f1 | sort || true
            echo '=== runner temp ==='; find "$RUNNER_TEMP" -maxdepth 4 -type f -print 2>/dev/null | head -n 500 || true
          } 2>&1 | tee "$RUNNER_TEMP/n01-bootstrap/first-step.log"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Execute deep diagnostics
        run: node scripts/diagnostics.mjs

      - name: Validate dependency graph
        run: npm ci --no-audit --no-fund

      - name: Execute real project checks
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run lint
          npm run mesh:contract:check
          npm run mesh:health:unit
          npm run mesh:async:unit
          npm run byok:check
          npm run vector-memory:check

      - name: Emergency runner capture
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics
          {
            echo '=== EMERGENCY CAPTURE ==='; date -u
            echo '=== runner ==='; uname -a; cat /etc/os-release
            echo '=== resources ==='; free -h; df -hT
            echo '=== processes ==='; ps -ef
            echo '=== temp/log candidates ==='
            find "$RUNNER_TEMP" -maxdepth 6 -type f -print 2>/dev/null | head -n 1500
            echo '=== workspace error/log candidates ==='
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \( -name '*.log' -o -iname '*error*' \) -print 2>/dev/null | head -n 1000
          } 2>&1 | tee .diagnostics/emergency-runner.log

      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeternum-core-29-diagnostics-${{ github.run_id }}
          path: .diagnostics/
          if-no-files-found: ignore
          retention-days: 14
