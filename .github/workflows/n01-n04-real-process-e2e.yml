name: N01-N04 Real Process E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n01-n04-real-process-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bidirectional-http-hmac:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout N01 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Install N01 dependencies
        run: npm ci --no-audit --no-fund
      - name: Checkout pinned N04 candidate
        uses: actions/checkout@v4
        with:
          repository: divibisoul/nextjs-ai-chatbots
          ref: fa0dcc5fff8a4144a97acca06cdfd88b389300e4
          path: .integration/n04
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify exact N04 source pin
        run: test "$(git -C .integration/n04 rev-parse HEAD)" = "fa0dcc5fff8a4144a97acca06cdfd88b389300e4"
      - name: Install N04 dependencies
        working-directory: .integration/n04
        run: pnpm install --frozen-lockfile
      - name: Generate ephemeral Mesh authentication and app secrets
        shell: bash
        run: |
          hmac_secret="$(openssl rand -hex 48)"
          bearer_token="$(openssl rand -hex 32)"
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$hmac_secret"
          echo "::add-mask::$bearer_token"
          echo "::add-mask::$auth_secret"
          {
            echo "SOUL_MESH_SECRET=$hmac_secret"
            echo "SOUL_MESH_HMAC_SECRET=$hmac_secret"
            echo "SOUL_MESH_TOKEN=$bearer_token"
            echo "AUTH_SECRET=$auth_secret"
            echo "POSTGRES_URL=postgresql://soulmesh:soulmesh@127.0.0.1:5432/soulmesh"
          } >> "$GITHUB_ENV"
      - name: Build N01 web runtime
        run: npm run build
      - name: Build N04 production runtime
        working-directory: .integration/n04
        run: pnpm run build
      - name: Bidirectional N01↔N04 real-process HTTP/HMAC E2E
        env:
          SOUL_N01_WORKDIR: ${{ github.workspace }}
          SOUL_N04_WORKDIR: ${{ github.workspace }}/.integration/n04
        run: node scripts/n01-n04-real-process-e2e.mjs
