name: N01-N04 Real Process E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n01-n04-real-process-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bidirectional-http-hmac:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soulmesh
          POSTGRES_PASSWORD: soulmesh
          POSTGRES_DB: soulmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soulmesh -d soulmesh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 35
    steps:
      - name: Checkout N01 candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - name: Install N01 dependencies
        run: npm ci --no-audit --no-fund
      - name: Checkout pinned N04 candidate
        uses: actions/checkout@v4
        with:
          repository: divibisoul/nextjs-ai-chatbots
          ref: 1e2c41ef3da054f6974085de9caed03d3db17f47
          path: .integration/n04
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Verify exact N04 source pin
        run: test "$(git -C .integration/n04 rev-parse HEAD)" = "1e2c41ef3da054f6974085de9caed03d3db17f47"
      - name: Install N04 dependencies
        working-directory: .integration/n04
        run: pnpm install --frozen-lockfile
      - name: Build N01 web runtime
        run: npm run build
      - name: Build N04 production runtime
        working-directory: .integration/n04
        run: pnpm run build
      - name: Generate ephemeral E2E-only Mesh authentication and app secrets
        shell: bash
        run: |
          hmac_secret="$(openssl rand -hex 48)"
          bearer_token="$(openssl rand -hex 32)"
          registration_n04="$(openssl rand -hex 32)"
          registration_n05="$(openssl rand -hex 32)"
          auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$hmac_secret"
          echo "::add-mask::$bearer_token"
          echo "::add-mask::$registration_n04"
          echo "::add-mask::$registration_n05"
          echo "::add-mask::$auth_secret"
          {
            echo "SOUL_MESH_SECRET=$hmac_secret"
            echo "SOUL_MESH_HMAC_SECRET=$hmac_secret"
            echo "SOUL_MESH_TOKEN=$bearer_token"
            echo "SOUL_MESH_N04_REGISTRATION_TOKEN=$registration_n04"
            echo "SOUL_MESH_N05_REGISTRATION_TOKEN=$registration_n05"
            echo "AUTH_SECRET=$auth_secret"
          } >> "$GITHUB_ENV"
      - name: Bidirectional N01↔N04 real-process HTTP/HMAC E2E
        env:
          SOUL_N01_WORKDIR: ${{ github.workspace }}
          SOUL_N04_WORKDIR: ${{ github.workspace }}/.integration/n04
          POSTGRES_URL: postgresql://soulmesh:soulmesh@127.0.0.1:5432/soulmesh
        run: node scripts/n01-n04-real-process-e2e.mjs
