name: N01 package-lock synchronization

on:
  push:
    branches:
      - feat/phase2-block1-core-2026-09-25
    paths-ignore:
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: n01-package-lock-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase2-block1-core-2026-09-25

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(n01): synchronize npm lockfile with package manifest"
          git push origin HEAD:feat/phase2-block1-core-2026-09-25
